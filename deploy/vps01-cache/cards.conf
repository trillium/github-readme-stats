# Allowlist of cached cards: <public name> <path and query on the local renderer>
# Only these two cards exist; the public hostname serves /<name>.svg and
# nothing else, so no visitor-supplied value ever reaches the renderer.
# The two query strings mirror the profile README embeds exactly.
# Paths are those of express.js (/ and /top-langs), not the Vercel /api/ ones.
stats /?username=trillium&show_icons=true&count_private=true&theme=react&bg_color=282a36&title_color=f40082&icon_color=ffd200&border_color=ffd200&border_radius=10&rank_icon=github&include_all_commits=true
top-langs /top-langs?username=trillium&langs_count=8&layout=compact&theme=react&bg_color=282a36&title_color=f40082&icon_color=ffd200&show_icons=true&border_color=ffd200&border_radius=10
